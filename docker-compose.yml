services:
  postgres:
    image: postgres:16-alpine
    container_name: guardian_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aws_guardian}
      POSTGRES_USER: ${POSTGRES_USER:-guardian_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guardian_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian_user -d aws_guardian"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: guardian_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-aws-guardian-prod-secret-99882233}
      - POSTGRES_DB=aws_guardian
      - POSTGRES_USER=guardian_user
      - POSTGRES_PASSWORD=guardian_secure_password_2026
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
